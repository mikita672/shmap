services:
  db:
    image: postgres:18.4
    container_name: shmap_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shmap_admin -d shmapdb"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
