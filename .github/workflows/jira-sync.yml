name: Jira Sync

on:
  schedule:
    - cron: "2-59/5 * * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Check every ticket, not only the ones changed in the last hour
        type: boolean
        default: false
  issues:
    types: [edited, labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: jira-sync
  queue: max

jobs:
  sync:
    name: Sync
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/scripts/jira-sync
    env:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/jira-sync

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/scripts/jira-sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync tickets
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FULL_FLAG: ${{ (github.event.schedule == '17 3 * * *' || inputs.full) && '--full' || '' }}
        run: node src/main.ts poll --apply "$FULL_FLAG"

      - name: Sync this event
        if: github.event_name == 'issues' || github.event_name == 'pull_request'
        run: node src/main.ts event --apply
