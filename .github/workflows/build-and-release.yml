name: Build & Release

on:
  pull_request:
    types: [closed]
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  version:
    name: Determine Version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next patch version
        id: calc
        run: |
          LATEST=$(git tag --list 'v0.0.*' --sort=-version:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEXT=0
          else
            CURRENT=${LATEST#v0.0.}
            NEXT=$((CURRENT + 1))
          fi
          echo "version=0.0.$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v0.0.$NEXT" >> "$GITHUB_OUTPUT"
          echo "📦 Next version: 0.0.$NEXT"

  lint-and-typecheck:
    name: Lint & Typecheck
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict)
        run: npm run typecheck

  build_android:
    name: Build Android (EAS)
    needs: [version, lint-and-typecheck]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Update version in app.json
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json','utf8'));
            cfg.expo.version = process.env.APP_VERSION;
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Build Android APK
        id: build_android
        run: |
          BUILD_JSON=$(eas build --platform android --profile release --non-interactive --wait --json)
          BUILD_ID=$(echo "$BUILD_JSON" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
              const builds = JSON.parse(d);
              console.log(builds[0].id);
            });
          ")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        run: |
          BUILD_URL=$(eas build:view ${{ steps.build_android.outputs.build_id }} --json | node -e "
            let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
              const build = JSON.parse(d);
              console.log(build.artifacts.buildUrl);
            });
          ")
          curl -fL -o shmap-android.apk "$BUILD_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/shmap-android.apk
          if-no-files-found: error

  build_ios:
    name: Build iOS Simulator (EAS)
    needs: [version, lint-and-typecheck]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Update version in app.json
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json','utf8'));
            cfg.expo.version = process.env.APP_VERSION;
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Build iOS Simulator App
        id: build_ios
        run: |
          BUILD_JSON=$(eas build --platform ios --profile release --non-interactive --wait --json)
          BUILD_ID=$(echo "$BUILD_JSON" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
              const builds = JSON.parse(d);
              console.log(builds[0].id);
            });
          ")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        run: |
          BUILD_URL=$(eas build:view ${{ steps.build_ios.outputs.build_id }} --json | node -e "
            let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
              const build = JSON.parse(d);
              console.log(build.artifacts.buildUrl);
            });
          ")
          curl -fL -o shmap-ios-simulator.tar.gz "$BUILD_URL"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: frontend/shmap-ios-simulator.tar.gz
          if-no-files-found: error

  build_ios_unsigned:
    name: Build iOS (Unsigned IPA)
    needs: [version, lint-and-typecheck]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update version in app.json
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json','utf8'));
            cfg.expo.version = process.env.APP_VERSION;
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: frontend/ios

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -workspace ios/shmap.xcworkspace \
            -scheme shmap \
            -configuration Release \
            -archivePath build/shmap.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -quiet

      - name: Install ldid
        run: brew install ldid

      - name: Ad-hoc sign and package IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/shmap.xcarchive/Products/Applications/shmap.app build/Payload/
          
          # Find all Mach-O binaries (main app + frameworks) and ad-hoc sign them with ldid
          # ldid recalculates the __LINKEDIT vmsize, avoiding the dyld crash caused by macOS codesign
          found_macho=false
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "Mach-O"; then
              found_macho=true
              ldid -S "$file"
            fi
          done < <(find build/Payload/shmap.app -type f -print0)
          
          if [ "$found_macho" = false ]; then
            echo "Error: No Mach-O binaries found"
            exit 1
          fi
          
          cd build
          zip -r -q ../shmap-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: frontend/shmap-ios-unsigned.ipa
          if-no-files-found: error

  deploy_backend:
    name: Deploy Backend to Cloud Run
    needs: [version, lint-and-typecheck]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/761707913997/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '761707913997-compute@developer.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy to Cloud Run
        run: |
          IMAGE_TAG="europe-central2-docker.pkg.dev/shmap-505120/shmap-repo/shmap-backend:${GITHUB_SHA}"
          gcloud builds submit ./backend --tag "$IMAGE_TAG" --project shmap-505120
          gcloud run deploy shmap-backend --image "$IMAGE_TAG" --region europe-central2 --project shmap-505120 \
            --update-secrets "RESEND_API_KEY=RESEND_API_KEY:latest"

  release:
    name: Create Release
    needs: [version, build_android, build_ios, build_ios_unsigned, deploy_backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download iOS Simulator App
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: artifacts/ios-simulator

      - name: Download iOS Unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: artifacts/ios-unsigned

      - name: Rename artifacts for release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv artifacts/android/shmap-android.apk "artifacts/shmap-${VERSION}-android.apk"
          mv artifacts/ios-simulator/shmap-ios-simulator.tar.gz "artifacts/shmap-${VERSION}-ios-simulator.tar.gz"
          mv artifacts/ios-unsigned/shmap-ios-unsigned.ipa "artifacts/shmap-${VERSION}-ios-unsigned.ipa"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          body: |
            ## 📱 Release ${{ needs.version.outputs.version }}

            ### Downloads
            - **Android**: `shmap-${{ needs.version.outputs.version }}-android.apk` — Install directly on your device
            - **iOS Simulator**: `shmap-${{ needs.version.outputs.version }}-ios-simulator.tar.gz` — Extract and drag into Simulator
            - **iOS (unsigned)**: `shmap-${{ needs.version.outputs.version }}-ios-unsigned.ipa` — Sign with your certificate before installing

            ### iOS Simulator Installation
            ```bash
            tar -xzf shmap-${{ needs.version.outputs.version }}-ios-simulator.tar.gz
            xcrun simctl install booted shmap.app
            ```

            ---
            *Built from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}*
          files: |
            artifacts/shmap-${{ needs.version.outputs.version }}-android.apk
            artifacts/shmap-${{ needs.version.outputs.version }}-ios-simulator.tar.gz
            artifacts/shmap-${{ needs.version.outputs.version }}-ios-unsigned.ipa
          generate_release_notes: true
          make_latest: true
