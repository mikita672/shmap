<!doctype html>
<html lang="en">
  <head>

    <title>Shmap</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <p class="logo">SHMAP</p>

        <p class="pitch">Add me on Shmap to plan routes together.</p>
      </section>
      <div class="actions">
        <a class="button button-primary" href="shmap://">Open in Shmap</a>
        <a
          class="button button-secondary"
          href="https://github.com/mikita672/shmap/releases/latest"

      </div>
      <p class="hint">No app yet? Install Shmap, then open this link again.</p>
    </main>
  </body>
</html>
