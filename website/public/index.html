<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shmap</title>
    <meta name="description" content="Plan routes with friends." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <p class="logo">SHMAP</p>
      <section class="card">
        <h1 class="title">Plan routes with friends</h1>
        <p class="text">
          Pick places on the map together and plan shared routes right in your
          group chats.
        </p>
      </section>
      <div class="actions">
        <a
          class="button button-primary"
          href="https://github.com/mikita672/shmap/releases/latest"
        >
          Get the app
        </a>
      </div>
      <p class="hint">Got a profile link from a friend? Open it on your phone.</p>
    </main>
  </body>
</html>
